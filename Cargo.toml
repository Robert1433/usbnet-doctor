[package]
name = "usbnet-doctor"
version = "0.2.0"
edition = "2021"
description = "Diagnostics for USB port speeds, hubs and USB network adapters on Windows and Linux"
license = "MIT"
repository = "https://github.com/Robert1433/usbnet-doctor"
readme = "README.md"
keywords = ["usb", "network", "diagnostics", "ethernet", "adapter"]
categories = ["command-line-utilities"]

# Windows: only windows-sys 0.59 and winreg. Both link through import
# libraries, so the crate builds on the GNU toolchain without MinGW binutils
# or Visual Studio.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_Time",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
]

# Linux: only libc (sockets, ioctls, getifaddrs, localtime).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
